[package]
name = "ferros"
version = "0.1.0"
edition = "2021"
authors = ["Mikhail Toshkin <toshkin.mikhail@gmail.com>"]
description = "ferros — an operating system written from scratch in Rust (x86_64, monolithic kernel)"
license-file = "LICENSE"
readme = "README.md"
publish = false

[dependencies]
# Классический BIOS-bootloader из экосистемы blog_os. Совместим с `bootimage` 0.10.x.
# Миграцию на bootloader 0.11 (BIOS+UEFI) планируем на этапе M11.
#
# Фича `map_physical_memory` (M3a): bootloader заранее отображает ВСЮ физическую
# память в виртуальное пространство по фиксированному оффсету и кладёт этот оффсет
# в `BootInfo::physical_memory_offset`. Так ядро может читать любой физический адрес
# (включая сами таблицы страниц) по формуле virt = phys + offset.
bootloader = { version = "0.9.23", features = ["map_physical_memory"] }

# Спин-блокировка для глобальных Writer'ов (VGA и serial): на голом железе нет
# ОС, которая усыпит поток, поэтому замок «крутится» в цикле. `Mutex::new` — const.
# Также используем `spin::LazyLock` для ленивой инициализации serial-порта.
spin = "0.12"

# Типобезопасные обёртки над x86_64: IDT, GDT, привилегированные инструкции,
# работа с портами и регистрами. Используем с M2 (прерывания).
x86_64 = "0.15"

# Контроллер прерываний 8259 PIC: перемапливание векторов и сигнал EOI. (M2c)
pic8259 = "0.11"

# Декодирование скан-кодов PS/2-клавиатуры в символы. (M2c)
pc-keyboard = "0.9"

# Простой аллокатор кучи на связном списке свободных блоков. Подключаем как
# `#[global_allocator]` (M3c) — он включает крейт `alloc` (Box/Vec/String). O(n) на
# аллокацию: для bring-up достаточно, быстрый fixed-size-block — в HARDENING.md.
linked_list_allocator = "0.10"

# Лок-фри очередь фиксированного размера (`ArrayQueue`) для очереди «разбуженных»
# задач в эффективном экзекьюторе (M4b). Берём без std: только `alloc`.
crossbeam-queue = { version = "0.3", default-features = false, features = ["alloc"] }

# Примитивы async: трейт `Stream` (+ `StreamExt::next`) и `AtomicWaker` для
# async-клавиатуры (M4c) — поток скан-кодов как задача. Без std: только `alloc`.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

[package.metadata.bootimage]
# Тестовый режим QEMU: устройство isa-debug-exit (ядро само завершит QEMU кодом
# успех/провал), вывод тестов в serial → stdio, без окна. С M6a подключаем второй диск
# через контроллер virtio-blk (PCI): отдельный `-drive if=none` + `-device`, чтобы не
# конфликтовать с загрузочным диском (его bootimage даёт первым). Образ создаёт build.rs.
test-args = [
    "-device", "isa-debug-exit,iobase=0xf4,iosize=0x04",
    "-serial", "stdio",
    "-display", "none",
    "-drive", "if=none,id=disk0,format=raw,file=target/ferros-disk.img",
    "-device", "virtio-blk-pci,drive=disk0",
]
# Те же аргументы для обычного `cargo run` (bootimage добавляет их к команде запуска).
run-args = [
    "-drive", "if=none,id=disk0,format=raw,file=target/ferros-disk.img",
    "-device", "virtio-blk-pci,drive=disk0",
]
# Код выхода QEMU при успехе: (0x10 << 1) | 1 = 33.
test-success-exit-code = 33
test-timeout = 60

# Интеграционный тест переполнения стека: свой `_start`, без стандартного
# тест-харнесса (он сам решает «успех» через double fault → exit_qemu).
[[test]]
name = "stack_overflow"
harness = false
