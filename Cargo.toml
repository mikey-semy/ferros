[package]
name = "ferros"
version = "0.1.0"
edition = "2021"
authors = ["Mikhail Toshkin <toshkin.mikhail@gmail.com>"]
description = "ferros — an operating system written from scratch in Rust (x86_64, monolithic kernel)"
license-file = "LICENSE"
readme = "README.md"
publish = false

[dependencies]
# Классический BIOS-bootloader из экосистемы blog_os. Совместим с `bootimage` 0.10.x.
# Миграцию на bootloader 0.11 (BIOS+UEFI) планируем на этапе M11.
bootloader = "0.9.23"

# Спин-блокировка для глобальных Writer'ов (VGA и serial): на голом железе нет
# ОС, которая усыпит поток, поэтому замок «крутится» в цикле. `Mutex::new` — const.
# Также используем `spin::LazyLock` для ленивой инициализации serial-порта.
spin = "0.12"

# Типобезопасные обёртки над x86_64: IDT, GDT, привилегированные инструкции,
# работа с портами и регистрами. Используем с M2 (прерывания).
x86_64 = "0.15"

# Контроллер прерываний 8259 PIC: перемапливание векторов и сигнал EOI. (M2c)
pic8259 = "0.11"

# Декодирование скан-кодов PS/2-клавиатуры в символы. (M2c)
pc-keyboard = "0.9"

[package.metadata.bootimage]
# Тестовый режим QEMU: устройство isa-debug-exit (ядро само завершит QEMU кодом
# успех/провал), вывод тестов в serial → stdio, без окна.
test-args = [
    "-device", "isa-debug-exit,iobase=0xf4,iosize=0x04",
    "-serial", "stdio",
    "-display", "none",
]
# Код выхода QEMU при успехе: (0x10 << 1) | 1 = 33.
test-success-exit-code = 33
test-timeout = 60

# Интеграционный тест переполнения стека: свой `_start`, без стандартного
# тест-харнесса (он сам решает «успех» через double fault → exit_qemu).
[[test]]
name = "stack_overflow"
harness = false
