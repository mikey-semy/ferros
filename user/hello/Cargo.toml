# Отдельная пользовательская программа (M5c1): собирается в самостоятельный статический
# ELF под свой таргет (x86_64-user.json) и встраивается в ядро через build.rs. НЕ член
# воркспейса ядра — иначе унаследовала бы дефолтный таргет ядра из его .cargo/config.toml.
# Пустой [workspace] делает крейт самостоятельным корнем — cargo не пытается прицепить его
# к пакету ядра уровнем выше (у того нет [workspace], но так надёжнее).
[workspace]

[package]
name = "hello"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "hello"
path = "src/main.rs"

# Программа-«фолтер» (M5c3b): намеренно падает в кольце 3 — для проверки, что ядро
# завершает процесс, а не падает само.
[[bin]]
name = "faulter"
path = "src/faulter.rs"

# Программа-«читатель» (M6d2): открывает и читает файл с диска через файловые сисколлы.
[[bin]]
name = "reader"
path = "src/reader.rs"

# Проверка getpid (M6f1): завершается со своим PID как кодом возврата.
[[bin]]
name = "getpidtest"
path = "src/getpidtest.rs"

# Проверка execve (M6f2): заменяет себя программой HELLO с диска.
[[bin]]
name = "exectest"
path = "src/exectest.rs"

# Проверка fork (M6f3): форкается; ребёнок и родитель выходят с разными кодами.
[[bin]]
name = "forktest"
path = "src/forktest.rs"

# Проверка fork+wait4 (M6f4): родитель дожидается ребёнка и проверяет его PID и код выхода.
[[bin]]
name = "waittest"
path = "src/waittest.rs"

# Проверка kill (M6f5): родитель убивает ребёнка SIGTERM и проверяет статус через wait4.
[[bin]]
name = "killtest"
path = "src/killtest.rs"

# Проверка записи файлов (M6g3): создаёт файл, пишет, закрывает, читает обратно и сверяет.
[[bin]]
name = "writetest"
path = "src/writetest.rs"

# Проверка листинга каталога (M6g5): читает корень через getdents64 и ищет HELLO.TXT.
[[bin]]
name = "lstest"
path = "src/lstest.rs"

# Проверка stdin (M7a): читает строку с клавиатуры через read(0) и печатает её обратно.
[[bin]]
name = "stdintest"
path = "src/stdintest.rs"

# Проверка argv (M7b): читает argc/argv с начального стека; запускается через execve из execargv.
# Кладётся на диск как ARGVECHO; в ядро НЕ встраивается.
[[bin]]
name = "argvecho"
path = "src/argvecho.rs"

# Запускатель (M7b): execve("ARGVECHO", [..]) — проверяет передачу argv через execve.
[[bin]]
name = "execargv"
path = "src/execargv.rs"

# Проверка cwd (M7c): getcwd/chdir/относительный open/`..`.
[[bin]]
name = "cwdtest"
path = "src/cwdtest.rs"

# Интерактивный shell (M7d): запускается ядром как PID 1, REPL + builtins + fork/exec/wait.
[[bin]]
name = "shell"
path = "src/shell.rs"

# coreutils (M7f): внешние программы в /bin, запускаются shell'ом. В ядро НЕ встраиваются.
[[bin]]
name = "echo"
path = "src/echo.rs"

[[bin]]
name = "cat"
path = "src/cat.rs"

[[bin]]
name = "ls"
path = "src/ls.rs"

[[bin]]
name = "mkdir"
path = "src/mkdir.rs"

[[bin]]
name = "rm"
path = "src/rm.rs"

[[bin]]
name = "rmdir"
path = "src/rmdir.rs"

# Проверка brk (M9a): растит/сжимает кучу, пишет/читает её. Встраивается в ядро.
[[bin]]
name = "brktest"
path = "src/brktest.rs"

# Проверка TLS (M9b): arch_prctl(ARCH_SET_FS) + чтение через fs:. Встраивается в ядро.
[[bin]]
name = "tlstest"
path = "src/tlstest.rs"

# panic=abort: у нас нет раскрутки стека в no_std-программе (и таргет тоже abort).
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
