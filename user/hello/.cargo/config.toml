# Сборка пользовательской программы под свой bare-metal таргет (не таргет ядра).
[build]
target = "x86_64-user.json"
rustflags = [
    # Линкер-скрипт: фиксированная база (высокий слот нижней половины) + постраничное
    # выравнивание секций.
    "-C", "link-arg=-Tlinker.ld",
    # Постраничный (4 КиБ) max-page-size, иначе lld раздул бы файл под 2 МиБ-выравнивание.
    "-C", "link-arg=-zmax-page-size=0x1000",
    # Статическая релокация: получаем фиксированный ET_EXEC, а не PIE.
    "-C", "relocation-model=static",
    # Большая модель кода: база выше 2 ГиБ не влезает в 32-битные релокации малой модели,
    # поэтому нужны 64-битные абсолютные адреса.
    "-C", "code-model=large",
]

[unstable]
json-target-spec = true
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]
