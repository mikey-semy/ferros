# Сборка ядра под наш голый таргет.
[build]
target = "x86_64-ferros.json"

# Пересобираем core и compiler_builtins под x86_64-ferros: готовых бинарников
# стандартной библиотеки под наш таргет не существует (потому и нужен rust-src).
# `alloc` добавим на этапе M3, когда появится куча.
[unstable]
# Свежий rustc/cargo (2026) прячет кастомные .json-таргеты за этим флагом.
json-target-spec = true
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]

# `cargo run` для ОС: bootimage склеивает ядро с bootloader и запускает QEMU.
[target.'cfg(target_os = "none")']
runner = "bootimage runner"
